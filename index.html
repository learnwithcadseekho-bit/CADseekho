<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CADseekho — practical CAD and engineering training in AutoCAD, SolidWorks, and more for students, engineers, and working professionals."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>CADseekho — Learn CAD. Build Skills. Solve Real Engineering Problems.</title>
  </head>
  <body>
    <div id="root">
      <!-- First-paint skeleton: shows an instant branded frame while the app
           bundle downloads. React replaces #root on mount, so this is discarded
           automatically. -->
      <div style="min-height: 100vh; background: #f5f3ed; font-family: 'Inter', 'Segoe UI', sans-serif">
        <div style="height: 72px; border-bottom: 1px solid #aeb9c9; display: flex; align-items: center; padding: 0 24px">
          <span style="font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-weight: 700; font-size: 20px; color: #1b2a4a">CADseekho</span>
        </div>
        <div style="max-width: 1440px; margin: 0 auto; padding: 96px 24px">
          <div style="height: 13px; width: 200px; background: #e4e0d6; border-radius: 2px"></div>
          <div style="height: 44px; width: min(560px, 92%); background: #e4e0d6; border-radius: 2px; margin-top: 26px"></div>
          <div style="height: 44px; width: min(420px, 72%); background: #e4e0d6; border-radius: 2px; margin-top: 12px"></div>
          <div style="height: 17px; width: min(460px, 82%); background: #ece9e1; border-radius: 2px; margin-top: 30px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
